<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <title>Dakkai Sushi | Acesso Administrativo</title>

  <style>
    :root {
      --vermelho: #b50b13;
      --vermelho-claro: #df2029;
      --dourado: #daa744;
      --dourado-claro: #f1ce83;
      --branco: #ffffff;
      --cinza: rgba(255, 255, 255, 0.64);
      --borda: rgba(255, 255, 255, 0.18);
      --fundo-card: rgba(8, 8, 8, 0.78);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #050505;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--branco);
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.26) 0%,
          rgba(0, 0, 0, 0.48) 48%,
          rgba(0, 0, 0, 0.82) 100%
        ),
        linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.52),
          rgba(0, 0, 0, 0.12),
          rgba(0, 0, 0, 0.48)
        ),
        url("https://images.unsplash.com/photo-1579027989536-b7b1f875659b?auto=format&fit=crop&w=2200&q=92");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 50% 17%,
          rgba(190, 12, 20, 0.18),
          transparent 25%
        ),
        radial-gradient(
          circle at 84% 65%,
          rgba(190, 12, 20, 0.12),
          transparent 26%
        ),
        radial-gradient(
          circle at 20% 65%,
          rgba(218, 167, 68, 0.07),
          transparent 28%
        );
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;

      padding:
        max(24px, env(safe-area-inset-top))
        18px
        max(28px, env(safe-area-inset-bottom));
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -30px;
      border-radius: 50%;
      background: var(--dourado);
      box-shadow: 0 0 12px rgba(218, 167, 68, 0.55);
      opacity: 0;
      animation: subir linear infinite;
    }

    .particle:nth-child(1) {
      left: 8%;
      width: 4px;
      height: 4px;
      animation-duration: 13s;
    }

    .particle:nth-child(2) {
      left: 21%;
      width: 6px;
      height: 6px;
      animation-duration: 17s;
      animation-delay: 2s;
    }

    .particle:nth-child(3) {
      left: 38%;
      width: 3px;
      height: 3px;
      animation-duration: 15s;
      animation-delay: 5s;
    }

    .particle:nth-child(4) {
      right: 32%;
      width: 5px;
      height: 5px;
      background: var(--vermelho-claro);
      animation-duration: 18s;
      animation-delay: 1s;
    }

    .particle:nth-child(5) {
      right: 18%;
      width: 4px;
      height: 4px;
      animation-duration: 14s;
      animation-delay: 4s;
    }

    .particle:nth-child(6) {
      right: 7%;
      width: 6px;
      height: 6px;
      animation-duration: 20s;
      animation-delay: 7s;
    }

    @keyframes subir {
      0% {
        transform: translate3d(0, 0, 0) scale(0.7);
        opacity: 0;
      }

      12% {
        opacity: 0.72;
      }

      75% {
        opacity: 0.28;
      }

      100% {
        transform: translate3d(35px, -115vh, 0) scale(1.4);
        opacity: 0;
      }
    }

    .brand {
      width: min(630px, 95%);
      margin: 4px auto 24px;
      text-align: center;
    }

    .brand-logo {
      display: block;
      width: min(500px, 92%);
      max-height: 360px;
      margin: 0 auto;
      object-fit: contain;
      object-position: center;
      border-radius: 22px;

      filter:
        drop-shadow(0 20px 38px rgba(0, 0, 0, 0.82))
        drop-shadow(0 0 18px rgba(181, 11, 19, 0.2));

      animation: flutuarLogo 4.6s ease-in-out infinite;
    }

    @keyframes flutuarLogo {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-10px) scale(1.012);
      }
    }

    .login-card {
      position: relative;
      width: min(525px, 100%);
      overflow: hidden;

      padding: 36px 41px 30px;

      border: 1px solid var(--borda);
      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(18, 14, 11, 0.86),
          rgba(5, 5, 5, 0.89)
        );

      box-shadow:
        0 38px 100px rgba(0, 0, 0, 0.76),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 70px;
      right: 70px;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(218, 167, 68, 0.9),
          transparent
        );
    }

    .login-card::after {
      content: "";
      position: absolute;
      top: -130px;
      right: -110px;

      width: 260px;
      height: 260px;

      border-radius: 50%;

      background: rgba(181, 11, 19, 0.14);
      filter: blur(18px);

      pointer-events: none;
    }

    .login-header {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 29px;
    }

    .login-header h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(31px, 5vw, 39px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.7px;
    }

    .login-header h1 span {
      color: var(--dourado);
    }

    .title-line {
      width: 57px;
      height: 3px;
      margin: 17px auto 18px;
      border-radius: 999px;
      background: var(--vermelho-claro);
      box-shadow: 0 0 15px rgba(223, 32, 41, 0.48);
    }

    .login-header p {
      max-width: 340px;
      margin: auto;

      color: rgba(255, 255, 255, 0.62);

      font-size: 16px;
      line-height: 1.55;
    }

    .form-group {
      position: relative;
      z-index: 2;
      margin-bottom: 18px;
    }

    .input-box {
      position: relative;
      min-height: 94px;

      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;

      background: rgba(0, 0, 0, 0.25);

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.25s ease,
        background 0.25s ease;
    }

    .input-box:focus-within {
      transform: translateY(-1px);

      border-color: rgba(218, 167, 68, 0.75);

      background: rgba(0, 0, 0, 0.39);

      box-shadow:
        0 0 0 4px rgba(218, 167, 68, 0.08),
        0 15px 35px rgba(0, 0, 0, 0.28);
    }

    .input-label {
      position: absolute;
      top: 17px;
      left: 54px;

      color: var(--dourado);

      font-size: 14px;
      font-weight: 600;
    }

    .input-icon {
      position: absolute;
      top: 16px;
      left: 19px;

      color: rgba(255, 255, 255, 0.9);

      font-size: 22px;
      line-height: 1;
    }

    .input-box input {
      position: absolute;
      left: 21px;
      right: 53px;
      bottom: 8px;

      width: calc(100% - 74px);
      height: 47px;

      border: 0;
      outline: 0;

      color: var(--branco);
      background: transparent;

      font-size: 17px;
    }

    .input-box input::placeholder {
      color: rgba(255, 255, 255, 0.43);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      bottom: 13px;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 10px;

      color: rgba(255, 255, 255, 0.64);
      background: transparent;

      font-size: 20px;
      cursor: pointer;
    }

    .toggle-password:hover {
      color: var(--branco);
      background: rgba(255, 255, 255, 0.06);
    }

    .form-options {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin: 4px 1px 23px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;

      color: rgba(255, 255, 255, 0.87);

      font-size: 14px;
      cursor: pointer;
    }

    .remember input {
      appearance: none;

      width: 20px;
      height: 20px;

      display: grid;
      place-items: center;

      border: 2px solid rgba(255, 255, 255, 0.86);
      border-radius: 3px;

      background: transparent;
      cursor: pointer;
    }

    .remember input:checked {
      border-color: var(--vermelho-claro);
      background: var(--vermelho);
    }

    .remember input:checked::after {
      content: "✓";

      color: #ffffff;

      font-size: 14px;
      font-weight: 800;
      line-height: 1;
    }

    .forgot {
      color: var(--dourado);
      font-size: 14px;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .login-button {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 67px;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 13px;

      color: #ffffff;

      background:
        linear-gradient(
          90deg,
          #ca1a23,
          #a90811 50%,
          #c81720
        );

      box-shadow:
        0 17px 40px rgba(150, 0, 8, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.8px;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        filter 0.2s ease,
        box-shadow 0.2s ease;
    }

    .login-button::before {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          110deg,
          transparent 20%,
          rgba(255, 255, 255, 0.22) 50%,
          transparent 78%
        );

      transform: translateX(-130%);
      transition: transform 0.7s ease;
    }

    .login-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);

      box-shadow:
        0 21px 48px rgba(150, 0, 8, 0.53),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .login-button:hover::before {
      transform: translateX(130%);
    }

    .login-button:disabled {
      opacity: 0.66;
      cursor: not-allowed;
      transform: none;
    }

    .login-button span {
      position: relative;
      z-index: 2;
    }

    .button-arrow {
      font-size: 28px;
      font-weight: 300;
    }

    .admin-divider {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      gap: 18px;

      margin: 35px 0 27px;

      color: rgba(255, 255, 255, 0.43);

      font-size: 14px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .admin-divider::before,
    .admin-divider::after {
      content: "";
      flex: 1;
      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2)
        );
    }

    .admin-divider::after {
      transform: scaleX(-1);
    }

    .motivation {
      position: relative;
      z-index: 2;

      min-height: 141px;
      overflow: hidden;

      padding: 24px 24px 20px 64px;

      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.035),
          rgba(0, 0, 0, 0.16)
        );
    }

    .quote {
      position: absolute;
      top: 17px;
      left: 19px;

      color: var(--dourado);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 55px;
      line-height: 1;
    }

    .motivation-text {
      min-height: 66px;

      display: flex;
      align-items: center;

      color: rgba(255, 255, 255, 0.95);

      font-size: 17px;
      line-height: 1.5;

      transition:
        opacity 0.4s ease,
        transform 0.4s ease,
        filter 0.4s ease;
    }

    .motivation-text.changing {
      opacity: 0;
      transform: translateY(8px);
      filter: blur(3px);
    }

    .phrase-progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      margin-top: 15px;
    }

    .phrase-progress span {
      width: 39px;
      height: 5px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.42);

      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    .phrase-progress span.active {
      background: var(--vermelho-claro);
      transform: scaleX(1.08);
    }

    .status {
      position: relative;
      z-index: 3;

      display: none;

      margin: 15px 0 0;
      padding: 12px 15px;

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;

      color: #ffffff;
      background: rgba(181, 11, 19, 0.9);

      text-align: center;
      font-size: 13px;
    }

    .status.show {
      display: block;
    }

    .footer {
      margin-top: 28px;

      color: rgba(255, 255, 255, 0.47);

      text-align: center;
      font-size: 13px;
      letter-spacing: 0.2px;

      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    @media (min-width: 900px) {
      .page {
        padding-top: 28px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-logo {
        width: min(510px, 70vw);
        max-height: 330px;
      }
    }

    @media (max-width: 600px) {
      body {
        background-attachment: scroll;
        background-position: 58% center;
      }

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .brand {
        width: 100%;
        margin-bottom: 17px;
      }

      .brand-logo {
        width: min(380px, 96%);
        max-height: 255px;
        border-radius: 17px;
      }

      .login-card {
        padding: 27px 20px 23px;
        border-radius: 21px;
      }

      .login-header {
        margin-bottom: 24px;
      }

      .login-header h1 {
        font-size: 30px;
      }

      .login-header p {
        font-size: 14px;
      }

      .input-box {
        min-height: 86px;
      }

      .input-box input {
        font-size: 16px;
      }

      .form-options {
        align-items: flex-start;
        gap: 12px;
      }

      .remember,
      .forgot {
        font-size: 12px;
      }

      .login-button {
        height: 60px;
        font-size: 17px;
      }

      .admin-divider {
        margin: 28px 0 22px;
        font-size: 12px;
      }

      .motivation {
        min-height: 132px;
        padding: 21px 17px 18px 53px;
      }

      .quote {
        left: 15px;
        font-size: 48px;
      }

      .motivation-text {
        font-size: 15px;
      }

      .phrase-progress span {
        width: 31px;
      }

      .footer {
        margin-top: 21px;
        font-size: 11px;
      }
    }

    @media (max-width: 390px) {
      .form-options {
        flex-direction: column;
        align-items: flex-start;
      }

      .login-card {
        padding-left: 16px;
        padding-right: 16px;
      }

      .motivation {
        padding-right: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>

  <main class="page">
    <header class="brand">
      <img
        class="brand-logo"
        src="/assets/logo-dakkai.webp"
        alt="Dakkai Sushi Brasil Oriente"
        fetchpriority="high"
        decoding="async"
        onerror="
          if (!this.dataset.fallback) {
            this.dataset.fallback = '1';
            this.src = '/assets/icon-512.png';
          } else {
            this.style.display = 'none';
          }
        "
      >
    </header>

    <section class="login-card">
      <div class="login-header">
        <h1>Bem-vindo <span>de volta</span></h1>

        <div class="title-line"></div>

        <p>
          Entre com suas credenciais para acessar o sistema Dakkai Sushi.
        </p>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <div class="input-box">
            <span class="input-icon">♙</span>
            <label class="input-label" for="email">Usuário</label>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="Digite seu usuário"
              autocomplete="email"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <div class="input-box">
            <span class="input-icon">♙</span>
            <label class="input-label" for="senha">Senha</label>

            <input
              id="senha"
              name="senha"
              type="password"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >

            <button
              class="toggle-password"
              id="togglePassword"
              type="button"
              aria-label="Mostrar senha"
            >
              ◉
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input id="remember" type="checkbox">
            <span>Lembrar de mim</span>
          </label>

          <a class="forgot" id="forgotPassword" href="#">
            Esqueceu sua senha?
          </a>
        </div>

        <button class="login-button" id="loginButton" type="submit">
          <span id="buttonText">ENTRAR</span>
          <span class="button-arrow">→</span>
        </button>

        <div class="status" id="statusMessage"></div>
      </form>

      <div class="admin-divider">
        Acesso administrativo
      </div>

      <div class="motivation" aria-live="polite">
        <span class="quote">“</span>

        <p class="motivation-text" id="motivationText">
          Disciplina é escolher entre o que você quer agora e o que você quer mais.
        </p>

        <div class="phrase-progress" id="phraseProgress">
          <span class="active"></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </section>

    <footer class="footer">
      Dakkai Sushi © 2026 · Todos os direitos reservados.
    </footer>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("senha");
    const togglePassword = document.getElementById("togglePassword");
    const forgotPassword = document.getElementById("forgotPassword");
    const loginButton = document.getElementById("loginButton");
    const buttonText = document.getElementById("buttonText");
    const statusMessage = document.getElementById("statusMessage");
    const motivationText = document.getElementById("motivationText");

    const progressItems = Array.from(
      document.querySelectorAll("#phraseProgress span")
    );

    const phrases = [
      "Disciplina é escolher entre o que você quer agora e o que você quer mais.",
      "Excelência não é um detalhe: é o padrão que faz o cliente voltar.",
      "Grandes negócios são construídos um pedido bem atendido de cada vez.",
      "A disciplina de hoje cria o faturamento de amanhã.",
      "Qualidade constante transforma um pedido em fidelidade.",
      "A Dakkai cresce quando cada pedido carrega o padrão da sua visão."
    ];

    let phraseIndex = 0;
    let phraseTimer = null;
    let statusTimer = null;

    function showStatus(message) {
      clearTimeout(statusTimer);

      statusMessage.textContent = message;
      statusMessage.classList.add("show");

      statusTimer = setTimeout(function () {
        statusMessage.classList.remove("show");
      }, 3500);
    }

    function changePhrase() {
      motivationText.classList.add("changing");

      setTimeout(function () {
        phraseIndex = (phraseIndex + 1) % phrases.length;

        motivationText.textContent = phrases[phraseIndex];

        progressItems.forEach(function (item, index) {
          item.classList.toggle("active", index === phraseIndex);
        });

        motivationText.classList.remove("changing");
      }, 400);
    }

    function startPhraseRotation() {
      clearInterval(phraseTimer);

      phraseTimer = setInterval(function () {
        changePhrase();
      }, 5000);
    }

    togglePassword.addEventListener("click", function () {
      const passwordVisible = passwordInput.type === "text";

      passwordInput.type = passwordVisible ? "password" : "text";

      togglePassword.textContent = passwordVisible ? "◉" : "◌";

      togglePassword.setAttribute(
        "aria-label",
        passwordVisible ? "Mostrar senha" : "Ocultar senha"
      );
    });

    forgotPassword.addEventListener("click", function (event) {
      event.preventDefault();

      showStatus(
        "A recuperação de senha ainda será conectada ao sistema."
      );
    });

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showStatus("Preencha o usuário e a senha.");
        return;
      }

      loginButton.disabled = true;
      buttonText.textContent = "ENTRANDO...";

      setTimeout(function () {
        window.location.href = "dashboard.html";
      }, 700);
    });

    startPhraseRotation();
  </script>
</body>
</html>
