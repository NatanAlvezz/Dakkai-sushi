 8%; width: 4px; height: 4px; animation-duration: 13s; } .particle:nth-child(2) { left: 21%; width: 6px; height: 6px; animation-duration: 17s; animation-delay: 2s; } .particle:nth-child(3) { left: 38%; width: 3px; height: 3px; animation-duration: 15s; animation-delay: 5s; } .particle:nth-child(4) { right: 32%; width: 5px; height: 5px; background: var(--vermelho-claro); animation-duration: 18s; animation-delay: 1s; } .particle:nth-child(5) { right: 18%; width: 4px; height: 4px; animation-duration: 14s; animation-delay: 4s; } .particle:nth-child(6) { right: 7%; width: 6px; height: 6px; animation-duration: 20s; animation-delay: 7s; } @keyframes subir { 0% { transform: translate3d(0, 0, 0) scale(0.7); opacity: 0; } 12% { opacity: 0.72; } 75% { opacity: 0.28; } 100% { transform: translate3d(35px, -115vh, 0) scale(1.4); opacity: 0; } } /* CONTEÚDO PRINCIPAL */ .login-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; } /* LOGO REDUZIDA */ .brand { width: min(330px, 80vw); margin: 0 auto 14px; text-align: center; } .brand-logo { display: block; width: 100%; max-width: 330px; max-height: 190px; margin: 0 auto; object-fit: contain; object-position: center; border-radius: 16px; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.82)) drop-shadow(0 0 14px rgba(181, 11, 19, 0.2)); animation: flutuarLogo 4.6s ease-in-out infinite; } @keyframes flutuarLogo { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.008); } } /* CARD REDUZIDO E CENTRALIZADO */ .login-card { position: relative; width: min(380px, 94vw); overflow: hidden; padding: 24px 25px 21px; border: 1px solid var(--borda); border-radius: 20px; background: linear-gradient( 145deg, rgba(18, 14, 11, 0.86), rgba(5, 5, 5, 0.9) ); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.74), inset 0 1px 0 rgba(255, 255, 255, 0.08); backdrop-filter: blur(21px); -webkit-backdrop-filter: blur(21px); } .login-card::before { content: ""; position: absolute; top: 0; left: 55px; right: 55px; height: 1px; background: linear-gradient( 90deg, transparent, rgba(218, 167, 68, 0.9), transparent ); } .login-card::after { content: ""; position: absolute; top: -120px; right: -110px; width: 230px; height: 230px; border-radius: 50%; background: rgba(181, 11, 19, 0.13); filter: blur(18px); pointer-events: none; } /* CABEÇALHO */ .login-header { position: relative; z-index: 2; margin-bottom: 21px; text-align: center; } .login-header h1 { font-family: Georgia, "Times New Roman", serif; font-size: 28px; font-weight: 400; line-height: 1.15; letter-spacing: -0.5px; } .login-header h1 span { color: var(--dourado); } .title-line { width: 48px; height: 3px; margin: 12px auto 13px; border-radius: 999px; background: var(--vermelho-claro); box-shadow: 0 0 13px rgba(223, 32, 41, 0.45); } .login-header p { max-width: 300px; margin: auto; color: rgba(255, 255, 255, 0.62); font-size: 13px; line-height: 1.5; } /* CAMPOS */ .form-group { position: relative; z-index: 2; margin-bottom: 13px; } .input-box { position: relative; min-height: 70px; border: 1px solid rgba(255, 255, 255, 0.17); border-radius: 12px; background: rgba(0, 0, 0, 0.26); transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease, background 0.25s ease; } .input-box:focus-within { transform: translateY(-1px); border-color: rgba(218, 167, 68, 0.75); background: rgba(0, 0, 0, 0.39); box-shadow: 0 0 0 4px rgba(218, 167, 68, 0.08), 0 13px 30px rgba(0, 0, 0, 0.27); } .input-label { position: absolute; top: 12px; left: 45px; color: var(--dourado); font-size: 12px; font-weight: 600; } .input-icon { position: absolute; top: 11px; left: 16px; color: rgba(255, 255, 255, 0.9); font-size: 18px; line-height: 1; } .input-box input { position: absolute; left: 17px; right: 48px; bottom: 5px; width: calc(100% - 65px); height: 37px; border: 0; outline: 0; color: var(--branco); background: transparent; font-size: 14px; } .input-box input::placeholder { color: rgba(255, 255, 255, 0.42); } .toggle-password { position: absolute; right: 7px; bottom: 5px; width: 38px; height: 38px; border: 0; border-radius: 9px; color: rgba(255, 255, 255, 0.65); background: transparent; font-size: 18px; cursor: pointer; } .toggle-password:hover { color: #ffffff; background: rgba(255, 255, 255, 0.06); } /* OPÇÕES */ .form-options { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 1px 16px; } .remember { display: flex; align-items: center; gap: 8px; color: rgba(255, 255, 255, 0.87); font-size: 12px; cursor: pointer; } .remember input { appearance: none; width: 17px; height: 17px; display: grid; place-items: center; border: 2px solid rgba(255, 255, 255, 0.86); border-radius: 3px; background: transparent; cursor: pointer; } .remember input:checked { border-color: var(--vermelho-claro); background: var(--vermelho); } .remember input:checked::after { content: "✓"; color: #ffffff; font-size: 12px; font-weight: 800; line-height: 1; } .forgot { color: var(--dourado); font-size: 12px; text-decoration: none; } .forgot:hover { text-decoration: underline; } /* BOTÃO REDUZIDO */ .login-button { position: relative; z-index: 2; width: 100%; height: 50px; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 23px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 11px; color: #ffffff; background: linear-gradient( 90deg, #ca1a23, #a90811 50%, #c81720 ); box-shadow: 0 15px 34px rgba(150, 0, 8, 0.37), inset 0 1px 0 rgba(255, 255, 255, 0.17); font-size: 15px; font-weight: 800; letter-spacing: 0.8px; cursor: pointer; transition: transform 0.2s ease, filter 0.2s ease, box-shadow 0.2s ease; } .login-button::before { content: ""; position: absolute; inset: 0; background: linear-gradient( 110deg, transparent 20%, rgba(255, 255, 255, 0.22) 50%, transparent 78% ); transform: translateX(-130%); transition: transform 0.7s ease; } .login-button:hover { transform: translateY(-2px); filter: brightness(1.12); box-shadow: 0 19px 42px rgba(150, 0, 8, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.21); } .login-button:hover::before { transform: translateX(130%); } .login-button:disabled { opacity: 0.66; cursor: not-allowed; transform: none; } .login-button span { position: relative; z-index: 2; } .button-arrow { font-size: 22px; font-weight: 300; } /* DIVISOR */ .admin-divider { position: relative; z-index: 2; display: flex; align-items: center; gap: 13px; margin: 22px 0 17px; color: rgba(255, 255, 255, 0.42); font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; } .admin-divider::before, .admin-divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient( 90deg, transparent, rgba(255, 255, 255, 0.2) ); } .admin-divider::after { transform: scaleX(-1); } /* FRASE REDUZIDA */ .motivation { position: relative; z-index: 2; min-height: 91px; overflow: hidden; padding: 15px 15px 13px 46px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px; background: linear-gradient( 145deg, rgba(255, 255, 255, 0.035), rgba(0, 0, 0, 0.16) ); } .quote { position: absolute; top: 11px; left: 14px; color: var(--dourado); font-family: Georgia, "Times New Roman", serif; font-size: 40px; line-height: 1; } .motivation-text { min-height: 43px; display: flex; align-items: center; color: rgba(255, 255, 255, 0.95); font-size: 12px; line-height: 1.45; transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease; } .motivation-text.changing { opacity: 0; transform: translateY(7px); filter: blur(3px); } .phrase-progress { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 9px; } .phrase-progress span { width: 26px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.4); transition: background 0.3s ease, transform 0.3s ease; } .phrase-progress span.active { background: var(--vermelho-claro); transform: scaleX(1.08); } /* MENSAGEM */ .status { position: relative; z-index: 3; display: none; margin-top: 11px; padding: 9px 11px; border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 8px; color: #ffffff; background: rgba(181, 11, 19, 0.9); text-align: center; font-size: 11px; } .status.show { display: block; } /* RODAPÉ */ .footer { margin-top: 15px; color: rgba(255, 255, 255, 0.45); text-align: center; font-size: 10px; letter-spacing: 0.2px; text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8); } /* CELULAR */ @media (max-width: 600px) { body { background-attachment: scroll; background-position: 58% center; } .page { justify-content: flex-start; padding-top: max(16px, env(safe-area-inset-top)); } .brand { width: min(285px, 78vw); margin-bottom: 12px; } .brand-logo { max-width: 285px; max-height: 165px; } .login-card { width: min(370px, 96vw); padding: 22px 19px 19px; } .login-header h1 { font-size: 26px; } .login-header p { font-size: 12px; } .input-box { min-height: 68px; } .form-options { gap: 8px; } .remember, .forgot { font-size: 11px; } .login-button { height: 49px; } .motivation-text { font-size: 11.5px; } } @media (max-width: 370px) { .brand { width: 250px; } .brand-logo { max-width: 250px; max-height: 145px; } .login-card { padding-left: 15px; padding-right: 15px; } .form-options { flex-direction: column; align-items: flex-start; } } @media (max-height: 820px) and (min-width: 601px) { .brand { width: 260px; margin-bottom: 8px; } .brand-logo { max-width: 260px; max-height: 140px; } .login-card { transform: scale(0.92); transform-origin: top center; } .footer { margin-top: -10px; } } @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } } .auth-checking .login-wrapper{opacity:0;pointer-events:none}.login-wrapper{transition:opacity .3s ease}.brand-logo{display:block!important;visibility:visible!important;opacity:1!important;width:min(330px,90%)!important;height:auto!important;max-height:190px!important;object-fit:contain!important;margin:0 auto!important}</style></head><body class="auth-checking"><div class="particles" aria-hidden="true"><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span><span class="particle"></span></div><main class="page"><div class="login-wrapper"><header class="brand"><img class="brand-logo" src="https://raw.githubusercontent.com/NatanAlvezz/Dakkai-sushi/main/assets/logo-dakkai.webp?v=20260726" alt="Logo oficial Dakkai Sushi" decoding="async" fetchpriority="high" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='../assets/logo-dakkai.webp?v=20260726';"></header><section class="login-card"><div class="login-header"><h1> Bem-vindo <span>de volta</span></h1><div class="title-line"></div><p> Entre com suas credenciais para acessar o sistema Dakkai Sushi. </p></div><form id="loginForm" novalidate><div class="form-group"><div class="input-box"><span class="input-icon">♙</span><label class="input-label" for="email"> Usuário </label><input id="email" name="email" type="email" placeholder="Digite seu usuário" autocomplete="email" required ></div></div><div class="form-group"><div class="input-box"><span class="input-icon">♙</span><label class="input-label" for="senha"> Senha </label><input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required ><button class="toggle-password" id="togglePassword" type="button" aria-label="Mostrar senha" > ◉ </button></div></div><div class="form-options"><label class="remember"><input id="remember" type="checkbox"><span>Lembrar de mim</span></label><a class="forgot" id="forgotPassword" href="#" > Esqueceu sua senha? </a></div><button class="login-button" id="loginButton" type="submit" ><span id="buttonText">ENTRAR</span><span class="button-arrow">→</span></button><div class="status" id="statusMessage" ></div></form><div class="admin-divider"> Acesso administrativo </div><div class="motivation" aria-live="polite" ><span class="quote">“</span><p class="motivation-text" id="motivationText" > Disciplina é escolher entre o que você quer agora e o que você quer mais. </p><div class="phrase-progress" id="phraseProgress" ><span class="active"></span><span></span><span></span><span></span><span></span><span></span></div></div></section><footer class="footer"> Dakkai Sushi © 2026 · Todos os direitos reservados. </footer></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script> "use strict"; const SUPABASE_URL = "https://zgsecglakjokifnhdxtk.supabase.co"; const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_O3YGOBBNIIVAxIdPRlP59Q_6k0d64lu"; /* IMPORTANTE: O login e o dashboard usam o mesmo armazenamento padrão do Supabase. Isso evita o ciclo index → dashboard → index que fazia as duas telas aparecerem alternadamente. */ const supabaseClient = window.supabase.createClient( SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } } ); const loginForm = document.getElementById("loginForm"); const emailInput = document.getElementById("email"); const passwordInput = document.getElementById("senha"); const togglePassword = document.getElementById("togglePassword"); const forgotPassword = document.getElementById("forgotPassword"); const rememberInput = document.getElementById("remember"); const loginButton = document.getElementById("loginButton"); const buttonText = document.getElementById("buttonText"); const statusMessage = document.getElementById("statusMessage"); const motivationText = document.getElementById("motivationText"); const progressItems = Array.from( document.querySelectorAll("#phraseProgress span") ); const phrases = [ "Disciplina é escolher entre o que você quer agora e o que você quer mais.", "Excelência não é um detalhe: é o padrão que faz o cliente voltar.", "Grandes negócios são construídos um pedido bem atendido de cada vez.", "A disciplina de hoje cria o faturamento de amanhã.", "Qualidade constante transforma um pedido em fidelidade.", "A Dakkai cresce quando cada pedido carrega o padrão da sua visão." ]; let phraseIndex = 0; let phraseTimer = null; let statusTimer = null; let loginInProgress = false; function setLoading(loading) { loginInProgress = loading; loginButton.disabled = loading; emailInput.disabled = loading; passwordInput.disabled = loading; rememberInput.disabled = loading; buttonText.textContent = loading ? "ENTRANDO..." : "ENTRAR"; loginButton.setAttribute( "aria-busy", loading ? "true" : "false" ); } function showStatus(message, type = "error", duration = 4200) { clearTimeout(statusTimer); statusMessage.textContent = message; statusMessage.classList.add("show"); if (type === "success") { statusMessage.style.background = "rgba(22, 125, 75, 0.94)"; statusMessage.style.borderColor = "rgba(79, 220, 146, 0.35)"; } else if (type === "info") { statusMessage.style.background = "rgba(90, 64, 18, 0.94)"; statusMessage.style.borderColor = "rgba(218, 167, 68, 0.42)"; } else { statusMessage.style.background = "rgba(181, 11, 19, 0.94)"; statusMessage.style.borderColor = "rgba(255, 255, 255, 0.14)"; } statusTimer = setTimeout(function () { statusMessage.classList.remove("show"); }, duration); } function translateAuthError(error) { const message = String(error?.message || "").toLowerCase(); if ( message.includes("invalid login credentials") || message.includes("invalid credentials") ) { return "E-mail ou senha incorretos."; } if (message.includes("email not confirmed")) { return "Seu e-mail ainda não foi confirmado."; } if ( message.includes("failed to fetch") || message.includes("network") ) { return "Não foi possível conectar. Verifique sua internet e tente novamente."; } if (message.includes("too many requests")) { return "Muitas tentativas. Aguarde alguns minutos e tente novamente."; } return error?.message ? "Erro ao entrar: " + error.message : "Não foi possível entrar no sistema."; } function changePhrase() { motivationText.classList.add("changing"); setTimeout(function () { phraseIndex = (phraseIndex + 1) % phrases.length; motivationText.textContent = phrases[phraseIndex]; progressItems.forEach(function (item, index) { item.classList.toggle("active", index === phraseIndex); }); motivationText.classList.remove("changing"); }, 400); } function startPhraseRotation() { clearInterval(phraseTimer); phraseTimer = setInterval(changePhrase, 5000); } async function redirectAuthenticatedUser(){try{const{data:{session},error}=await supabaseClient.auth.getSession();if(error)throw error;if(session){window.location.replace("/admin/dashboard.html");return}}catch(error){console.error("[Dakkai Auth] Falha ao verificar sessão:",error)}document.body.classList.remove("auth-checking")} togglePassword.addEventListener("click", function () { const passwordVisible = passwordInput.type === "text"; passwordInput.type = passwordVisible ? "password" : "text"; togglePassword.textContent = passwordVisible ? "◉" : "◌"; togglePassword.setAttribute( "aria-label", passwordVisible ? "Mostrar senha" : "Ocultar senha" ); passwordInput.focus(); }); forgotPassword.addEventListener("click", async function (event) { event.preventDefault(); const email = emailInput.value.trim().toLowerCase(); if (!email) { showStatus( "Digite seu e-mail no campo Usuário para recuperar a senha.", "info" ); emailInput.focus(); return; } forgotPassword.style.pointerEvents = "none"; forgotPassword.style.opacity = "0.55"; const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + "/admin/index.html" }); forgotPassword.style.pointerEvents = ""; forgotPassword.style.opacity = ""; if (error) { showStatus(translateAuthError(error)); return; } showStatus( "Enviamos as instruções de recuperação para o seu e-mail.", "success", 6000 ); }); loginForm.addEventListener("submit", async function (event) { event.preventDefault(); if (loginInProgress) { return; } const email = emailInput.value.trim().toLowerCase(); const password = passwordInput.value; if (!email || !password) { showStatus("Preencha o usuário e a senha."); (!email ? emailInput : passwordInput).focus(); return; } if (!emailInput.checkValidity()) { showStatus("Digite um endereço de e-mail válido."); emailInput.focus(); return; } localStorage.setItem( "dakkai_remember", rememberInput.checked ? "true" : "false" ); setLoading(true); showStatus( "Validando suas credenciais com segurança...", "info", 9000 ); try { const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password }); if (error) { throw error; } if (!data?.session) { throw new Error( "A autenticação foi aceita, mas a sessão não foi criada." ); } showStatus( "Acesso autorizado. Abrindo a Central Dakkai...", "success", 2600 ); window.setTimeout(function () { window.location.replace("/admin/dashboard.html"); }, 650); } catch (error) { console.error("[Dakkai Auth] Erro de login:", error); showStatus(translateAuthError(error)); setLoading(false); passwordInput.select(); } }); window.addEventListener("pageshow", function () { setLoading(false); }); document.addEventListener("keydown", function (event) { if ( event.key === "Enter" && document.activeElement === togglePassword ) { event.preventDefault(); } }); rememberInput.checked = localStorage.getItem("dakkai_remember") === "true"; startPhraseRotation(); redirectAuthenticatedUser(); </script></body></html>
