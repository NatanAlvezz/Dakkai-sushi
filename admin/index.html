<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Dakkai Sushi | Acesso Administrativo</title>
  <style>
    :root{--red:#b50b13;--red2:#df2029;--gold:#daa744;--white:#fff;--line:rgba(255,255,255,.16)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:20px;color:#fff;font-family:Arial,Helvetica,sans-serif;background:
      linear-gradient(rgba(0,0,0,.52),rgba(0,0,0,.82)),
      url("https://images.unsplash.com/photo-1579027989536-b7b1f875659b?auto=format&fit=crop&w=2200&q=92") center/cover fixed}
    .wrap{width:min(380px,94vw);text-align:center}
    .logo{width:min(300px,78vw);max-height:150px;object-fit:contain;margin:0 auto 14px;filter:drop-shadow(0 14px 28px #000)}
    .card{padding:25px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(18,14,11,.88),rgba(5,5,5,.92));box-shadow:0 30px 80px rgba(0,0,0,.7);backdrop-filter:blur(20px)}
    h1{font:400 28px Georgia,serif} h1 span{color:var(--gold)}
    .sub{color:rgba(255,255,255,.62);font-size:13px;line-height:1.5;margin:10px 0 20px}
    label{display:block;text-align:left;color:var(--gold);font-size:12px;margin:0 0 7px 3px}
    input{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.35);color:#fff;padding:0 14px;font-size:14px;outline:none;margin-bottom:14px}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(218,167,68,.08)}
    button{width:100%;height:49px;border:0;border-radius:12px;color:#fff;font-weight:800;letter-spacing:.7px;background:linear-gradient(90deg,var(--red2),var(--red));cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .status{min-height:20px;margin-top:13px;color:#ffc2c5;font-size:12px;line-height:1.4}
    .hint{margin-top:14px;color:rgba(255,255,255,.45);font-size:10px}
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="/assets/logo-dakkai.webp" alt="Dakkai Sushi" onerror="this.src='/assets/icon-512.png'">
    <section class="card">
      <h1>Painel <span>Dakkai</span></h1>
      <p class="sub">Entre com sua conta autorizada para operar pedidos, cozinha e entregas.</p>
      <form id="form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required placeholder="seuemail@exemplo.com">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha">
        <button id="submit" type="submit">ENTRAR</button>
        <div class="status" id="status"></div>
      </form>
      <p class="hint">Acesso protegido pelo Supabase Auth.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    const cfg = window.DAKKAI_SUPABASE;
    const client = supabase.createClient(cfg.url, cfg.publishableKey);
    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const submit = document.getElementById("submit");

    async function redirectIfLogged(){
      const {data:{session}} = await client.auth.getSession();
      if(session) location.replace("./dashboard.html");
    }
    redirectIfLogged();

    form.addEventListener("submit", async (event)=>{
      event.preventDefault();
      status.textContent = "";
      submit.disabled = true;
      submit.textContent = "ENTRANDO...";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const {error} = await client.auth.signInWithPassword({email,password});
      if(error){
        status.textContent = error.message === "Invalid login credentials"
          ? "E-mail ou senha incorretos."
          : "Não foi possível entrar: " + error.message;
        submit.disabled = false;
        submit.textContent = "ENTRAR";
        return;
      }
      location.replace("./dashboard.html");
    });
  </script>
</body>
</html>
