<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dakkai Sistema</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
url('https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=1800&q=80');
background-size:cover;
background-position:center;
}

.login{
width:420px;
background:rgba(10,10,10,.82);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:45px;
box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.logo{
width:230px;
display:block;
margin:auto;
margin-bottom:35px;
}

h1{
color:white;
text-align:center;
font-size:30px;
margin-bottom:10px;
}

p{
color:#bbb;
text-align:center;
margin-bottom:30px;
}

input{
width:100%;
padding:16px;
margin-bottom:18px;
background:#1b1b1b;
border:none;
border-radius:10px;
color:white;
font-size:16px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:10px;
background:#b30000;
color:white;
font-size:17px;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
background:#d50000;
}

footer{
margin-top:25px;
text-align:center;
color:#999;
font-size:13px;
}
</style>

</head>

<body>

<div class="login">

<img src="../assets/img/logo.png" class="logo">

<h1>Dakkai Sistema</h1>

<p>Gestão Inteligente para Restaurantes</p>

<input type="email" placeholder="E-mail">

<input type="password" placeholder="Senha">

<button>Entrar</button>

<footer>
© 2026 Dakkai Sistema
</footer>

</div>

</body>
</html>
